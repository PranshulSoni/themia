[package]
name = "widget-music"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_music"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
rustfft = "6"
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }
