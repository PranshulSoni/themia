[package]
name = "widget-mixer"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_mixer"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }
