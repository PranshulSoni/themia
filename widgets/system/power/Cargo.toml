[package]
name = "widget-power"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_power"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
