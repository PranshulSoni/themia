[package]
name = "widget-screentime"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_screentime"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "windef",
    "minwindef",
    "minwinbase",
    "ntdef",
    "winuser",
    "sysinfoapi",
    "processthreadsapi",
    "winbase",
    "handleapi",
    "winver",
    "winnt",
    "tlhelp32",
] }
