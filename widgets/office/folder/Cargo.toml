[package]
name = "widget-folder"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_folder"

[dependencies]
tauri = { version = "2", features = [] }
png = "0.17"
base64 = "0.22"
log = "0.4"
serde = { version = "1", features = ["derive"] }

ureq = { version = "2", features = ["tls"] }
url = "2"
widget-netproxy = { path = "../../netproxy", features = ["ureq-agent"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }
trash = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["windef", "winuser", "winbase", "shellapi", "wingdi", "fileapi", "combaseapi", "objbase"] }
winreg = "0.52"
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
