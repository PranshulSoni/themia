[package]
name = "widget-email"
version = "0.1.0"
edition = "2021"

[lib]
name = "widget_email"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
# Timezone-correct datetime math: convert TZID-local / numeric-offset wall-clock
# times to a true UTC instant (issue #66 CalDAV TZID, issue #45 RFC 2822 offset).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
imap = "2"
native-tls = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
once_cell = "1"
widget-netguard = { path = "../../netguard" }
widget-netproxy = { path = "../../netproxy", features = ["reqwest-client"] }

[target.'cfg(target_os = "windows")'.dependencies]
# dpapi/wincrypt/winbase: DPAPI secret-at-rest encryption (CryptProtectData /
# CryptUnprotectData / LocalFree) for tokens + passwords. (S3)
winapi = { version = "0.3", features = ["shellapi", "winreg", "winnt", "dpapi", "wincrypt", "winbase"] }

[dev-dependencies]
# HTTP mock server for fetch/pagination integration tests (test-only).
mockito = "1"
# Test-only tokio features: `macros` for #[tokio::test], rt-multi-thread/net so
# reqwest's async client has a real runtime in tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
