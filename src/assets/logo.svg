<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ad9ff"/>
      <stop offset="1" stop-color="#60cdff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Widget grid -->
  <g filter="url(#glow)">
    <rect x="11" y="11" width="18" height="18" rx="4" fill="url(#accent)"/>
    <rect x="33" y="11" width="20" height="10" rx="3" fill="rgba(255,255,255,0.18)"/>
    <rect x="33" y="25" width="20" height="14" rx="3" fill="rgba(255,255,255,0.12)"/>
    <rect x="11" y="33" width="14" height="20" rx="3" fill="rgba(255,255,255,0.14)"/>
    <rect x="29" y="43" width="24" height="10" rx="3" fill="rgba(255,255,255,0.10)"/>
  </g>
</svg>
