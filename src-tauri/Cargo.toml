[package]
name = "themia"
version = "0.15.1"
authors = ["Nathaniel Walser"]
license = "Elastic-2.0"
edition = "2021"

[lib]
name = "themia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools", "tray-icon"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
percent-encoding = "2"
widget-netguard = { path = "../widgets/netguard" }
widget-netproxy = { path = "../widgets/netproxy", features = ["reqwest-client"] }
widget-folder = { path = "../widgets/office/folder" }
widget-email = { path = "../widgets/office/email" }
widget-cpu = { path = "../widgets/system/cpu" }
widget-screentime = { path = "../widgets/system/screentime" }
widget-gpu = { path = "../widgets/system/gpu" }
widget-ping = { path = "../widgets/system/ping" }
widget-volume = { path = "../widgets/system/volume" }
widget-mixer = { path = "../widgets/system/mixer" }
widget-power = { path = "../widgets/system/power" }
widget-music = { path = "../widgets/others/music" }
widget-clipboard = { path = "../widgets/others/clipboard" }
widget-battery = { path = "../widgets/system/battery" }
widget-bluetooth = { path = "../widgets/system/bluetooth" }
widget-license = { path = "../widgets/license" }
widget-gallery = { path = "../widgets/others/gallery" }
widget-notes = { path = "../widgets/others/notes" }

tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1", features = ["sync"] }
sys-locale = "0.3"
uuid = { version = "1", features = ["v4"] }
# Hashes the anonymous install UUID into TelemetryDeck's `clientUser`, so the
# raw id never leaves the machine (analytics SPEC [S-09]).
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["windef", "winuser", "minwindef", "wingdi", "dwmapi", "uxtheme", "libloaderapi", "winreg", "winnt", "processthreadsapi", "handleapi", "winbase", "shellapi", "commctrl", "memoryapi", "tlhelp32", "securitybaseapi"] }
windows = { version = "0.61", features = [
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    # OSVERSIONINFOW + ntdll's RtlGetVersion, for the OS version reported to
    # analytics. RtlGetVersion is used rather than GetVersionExW because the
    # latter is shimmed by the app manifest and lies about the build number.
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_System_Memory",
    # [LOG-09] RegisterEventSourceW/ReportEventW mirror ERROR records into the
    # Windows Application log. Win32_Security comes with them: ReportEventW
    # takes a PSID (always None here — the event is not user-attributed).
    "Win32_System_EventLog",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Foundation",
] }
windows-core = "0.61"
# Raw WebView2 access (ICoreWebView2) for the Web Element widget: receive the
# page→host `postMessage` from our injected scripts via `add_WebMessageReceived`.
# Version pinned to what Tauri 2.10 resolves so the `with_webview` controller type
# unifies.
webview2-com = "0.38"
